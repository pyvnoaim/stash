# Push to main -> build the image on GitHub -> push it to GHCR -> tell Dokploy to redeploy.
# The VPS never builds: it only pulls ghcr.io/pyvnoaim/stash:latest (pull_policy: always in Dokploy).
# Every build is also tagged with its short sha, so a rollback is changing the tag in Dokploy.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: false

      # DOKPLOY_WEBHOOK is the service's webhook URL (Dokploy > stash > Deployments). It carries a token, hence the secret.
      - name: Redeploy on Dokploy
        env:
          URL: ${{ secrets.DOKPLOY_WEBHOOK }}
        run: curl -fsS -X POST "$URL"
