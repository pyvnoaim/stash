# Every push to main carries a version bump (CLAUDE.md says so); this stamps that version onto
# the commit as a GitHub release, so self-hosters get fixed points to pin instead of tracking
# main live. A release-created tag arrives as a `create` event, not a `push`, so the Portainer
# deploy webhook does not fire a second time — pushing tags with git would.
name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=v$(node -p "require('./package.json').version")
          gh release view "$v" >/dev/null 2>&1 || gh release create "$v" --generate-notes
