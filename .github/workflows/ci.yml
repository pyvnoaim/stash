name: ci
on: [push, pull_request]
# One run per branch: three quick pushes queue three publishes, and whichever finished last owned
# :latest — an older build could overwrite a newer one. Superseded runs are cancelled instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # The image is built here, not on the VPS: Portainer strips .git from its clone, so a build
  # there can never learn its own commit — About said "source" forever. CI's checkout has the
  # repo, the sha stamps in, and Portainer only pulls.
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # buildx + the gha cache: without it every publish runs `npm ci` from nothing inside docker.
      # Cached, the dependency layer only rebuilds when package-lock changes — the build is just vite.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/pyvnoaim/stash:latest
            ghcr.io/pyvnoaim/stash:${{ github.sha }}
