<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f5f8" id="themecolor">
<title>Stash</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6fd0'/%3E%3Crect x='27' y='15' width='10' height='34' rx='5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?4">
</head>
<body>

<nav id="sidebar">
  <div class="brand">
    <i class="tick"></i>
    <span>Stash</span>
    <button id="theme" class="ghost mono" title="Appearance">auto</button>
  </div>
  <div id="views" class="group"></div>
  <h2>Projects <button id="newproject" class="ghost" title="New project">+</button></h2>
  <div id="projects" class="group"></div>
  <footer>
    <button id="openpalette" class="ghost mono">Commands <kbd>⌘K</kbd></button>
  </footer>
</nav>

<main>
  <header>
    <button id="menu" class="ghost" aria-label="Show projects">☰</button>
    <i class="tick" id="titletick"></i>
    <h1 id="title" class="mono"></h1>
    <span id="count" class="mono meta"></span>
    <input type="search" id="search" placeholder="Search" aria-label="Search all items">
  </header>

  <form id="capture" autocomplete="off">
    <div class="seg" id="seg">
      <button type="button" data-type="task" class="on">Task</button>
      <button type="button" data-type="idea">Idea</button>
      <button type="button" data-type="note">Note</button>
    </div>
    <input type="text" id="box" placeholder="Add to Stash" aria-label="Add an item">
    <div id="preview" class="mono meta"></div>
  </form>

  <div id="list" tabindex="-1"></div>
</main>

<aside id="inspector" aria-label="Item details"></aside>

<div id="palette" class="overlay" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-label="Commands">
    <input type="text" id="palettebox" placeholder="Jump to a project, run a command" aria-label="Command palette">
    <div id="paletteresults"></div>
  </div>
</div>

<div id="toast" role="status" hidden></div>
<input type="file" id="importfile" accept="application/json" hidden>

<!-- ?4 = cache bust; bump it after editing js/css, or the browser keeps the old copy -->
<script src="parse.js?4"></script>
<script src="app.js?4"></script>
</body>
</html>
