services:
  stash:
    # Pulled, not built: Portainer deletes .git from its clone, so a VPS build cannot stamp its
    # commit into About. CI builds this image on every push to main (see .github/workflows/ci.yml).
    image: ghcr.io/pyvnoaim/stash:latest
    restart: unless-stopped
    # Optional: lets the hosted MCP route read the stocks — everything else runs the same without it.
    environment:
      STASH_TD_KEY: ${STASH_TD_KEY:-}
    # A volume that already existed before the container dropped to the node user is still owned by
    # root, and Docker never re-stamps one it did not just create. Once, on an existing deployment:
    #   docker compose run --rm --user root --entrypoint chown stash -R node:node /data
    volumes: ['stash:/data']
    # 401 is the healthy answer from /api/me without a cookie: the process is up and the database
    # is answering. Docker restarts it if that stops being true; uptime-kuma watches the domain.
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/api/me').then(r=>process.exit(r.status===401?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    # nginx proxy manager terminates TLS: join its docker network and point a proxy host at
    # stash:8787. No published ports — the proxy is the only way in. `docker network ls` says
    # what your proxy network is called; set PROXY_NET if it is not npm_default.
    networks: [proxy]
networks:
  proxy:
    external: true
    name: ${PROXY_NET:-npm_default}
volumes:
  stash:
