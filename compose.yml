services:
  stash:
    build: .
    restart: unless-stopped
    # A volume that already existed before the container dropped to the node user is still owned by
    # root, and Docker never re-stamps one it did not just create. Once, on an existing deployment:
    #   docker compose run --rm --user root --entrypoint chown stash -R node:node /data
    volumes: ['stash:/data']
    # The server reads "9am" and "today" for Claude's captures, so it needs your clock, not UTC:
    # at 10:00 in Berlin "standup 9am" was still ahead by the container's, and filed overdue.
    environment:
      TZ: ${TZ:-Europe/Berlin}
    # /healthz reads the database: up and answering, or Docker restarts it. uptime-kuma watches the domain.
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    # nginx proxy manager terminates TLS: join its docker network and point a proxy host at
    # stash:8787. No published ports — the proxy is the only way in. `docker network ls` says
    # what your proxy network is called; set PROXY_NET if it is not npm_default.
    networks: [proxy]
networks:
  proxy:
    external: true
    name: ${PROXY_NET:-npm_default}
volumes:
  stash:
